<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Badge</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #11998e, #38ef7d);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }

        .card {
            background: white;
            width: 90%;
            max-width: 600px;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #4e54c8;
        }

        h2 {
            margin-bottom: 10px;
        }

        p {
            line-height: 1.8;
        }

        .version {
            margin-top: 25px;
            padding: 10px;
            background: #4e54c8;
            color: white;
            border-radius: 10px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>Digital Badge</h1>

        <h2>นาย พงศกร แก้วจันทร์</h2>

        <p>
            671540005008-1
        </p>

        <p>
            นักศึกษาวิศวกรรมคอมพิวเตอร์<br>
            มหาวิทยาลัยกาฬสินธุ์
        </p>

        <h3>นอนเล่น เเละขอเงินเเม่</h3>

        <p>
            ต้องการทำงานด้านการพัฒนาซอฟต์แวร์<br>
            และพัฒนาความรู้ด้านเทคโนโลยีเพื่อนำไปใช้ในการทำงาน
        </p>

        <div class="version">Version 1.1</div>
        <p>Updated by compose</p>
        </div>
    </div>

</body>
</html>
